# Task 052 — clamd for ASH (replaces the image's /etc/clamav/clamd.conf).
# Files up to the upload limit (ASH_MAX_UPLOAD_MB, default 50 MB) must be scanned whole: a file larger than
# StreamMaxLength is NOT scanned (clamd answers with an error → the API keeps it in quarantine).
Foreground yes
LogFile /dev/stdout
LogTime yes
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M

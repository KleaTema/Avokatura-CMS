# Task 052 — the frontend's main nginx configuration (nginx-unprivileged, non-root, read-only root filesystem).
# Everything written at run time is under /tmp (mount it as a tmpfs): the generated site configuration and
# /config.json (docker-entrypoint.sh), the pid file and nginx's temporary files.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access log to stdout; the request line only (the query string may carry ?q= search text — never logged)
    log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                                '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"ms":$request_time,'
                                '"upstream_ms":"$upstream_response_time","request_id":"$request_id"}';
    access_log /dev/stdout json;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # SignalR: upgrade the connection when the client asks for a WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /tmp/ash/site.conf;
}
